[project]
name = "ahirena-core"
version = "0.1.0"
description = "Ahirena yerel uygulama çekirdeği: API, oturumlar, model adaptörleri"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pyodbc>=5.3.0",
]

[project.scripts]
ahirena-core = "ahirena_core.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahirena_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: gerçek yerel Ollama sunucusu ve indirilmiş model gerektirir",
    "packaged: PyInstaller ile üretilmiş build/dist/ahirena-core.exe gerektirir",
]
addopts = "-m 'not ollama and not packaged' --basetemp=.pytest-tmp"
